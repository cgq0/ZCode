# ============================================================================
# release — cgq0 fork 专属 CI：构建 cli / server / desktop 三产物并发布 Release
#
# 注意：GitHub 只从 <默认分支>/.github/workflows/ 读取 workflow，本文件无法收进
# cgq0/ 命名空间——这是 cgq0/ 隔离原则的唯一例外。上游当前没有 .github 目录，
# 新文件不产生合并冲突；上游代码不依赖本文件。
#
# 发版形态（2026-10-24 裁决，见 cgq0/docs/diary/2026-10-24.mac.md；
# 2026-10-25 选 B 裁决：zcode-server staged 目录换为 zcode-webapp 自托管 Web 产物）：
#   - 每平台一条 zip：zcode-v<版本>-cq.<n>.g<sha>-<target>.zip，包内文件名不带版本：
#     zcode-cli（win: zcode-cli.exe）、zcode-serve(+.ps1) 与 zcode-webapp/（自包含
#     Web 服务：server bundle + 前端 + agent + 随包 Node），darwin-x64 额外含
#     ZCode.fork.app（桌面只打 x86 mac，省 runner 配额；产品名/图标为 fork 专属
#     蓝底，与官方 ZCode.app 可同装互不覆盖）。
#   - 三产物版本统一为 monorepo 根版本 3.16.2 + `+cq.<n>.g<sha>`：cli 由 build.mjs
#     注入（base 从根 package.json 读取）；desktop 由 build-metadata.mjs 写入
#     build-meta.json（About 展示）；server stage 本就读根版本。Release tag、zip
#     文件名、二进制 --version、桌面 About 四处身份一致。
#   - tag 恒为 v<根 package.json 版本号>（2026-10-24 起，此前为 zcode-cli-v*）。tag 不再
#     参与 cq.<n> 基线：2026-10-25 起基线 = 最近官方同步合并提交（scripts/fork-build-meta.mjs）。
#   - 每次 push 刷新标题/说明并整体替换资产；旧构建经 Actions run artifacts 回溯
#     （保留 14 天），Release 页面不累积。
#
# 构建链路（全部来自上游自带脚本，无自定义构建逻辑）：
#   cli     pnpm --filter "@zcode/cli..." build → tsc shared dist → 插件 dist →
#           pnpm --filter @zcode/cli sea --target T（Node SEA 单文件）
#   webapp  pnpm --filter @zcode/server build（build:remote 产 entry-http 自包含
#           bundle）→ pnpm --filter @zcode/web build →
#           node cgq0/scripts/stage-webapp.mjs（bundle+web+agent+node-pty+随包 Node）
#   desktop packages/desktop/scripts/bundle.mjs --os mac --arch x64（上游正式打包入口：
#           runtime assets + production build + electron-builder + 运行时闭包校验）。
#           必须走 bundle.mjs 而非裸 electron-builder：electron-builder.config.js 的
#           platform/arch 来自 target-platform.mjs 读 ZCODE_TARGET_OS/ARCH env，
#           裸 CLI flags 不会让 config hooks 用对 arch。macos-13（Intel）runner 已
#           退役，在 macos-latest（arm64）上交叉打 x64；若交叉产物异常，后备
#           macos-15-intel（原生 x64，2027 秋前可用但偏慢）。
#   注意：不要用上游的 build:sea 脚本——它末尾固定 `node scripts/build-sea.mjs --all`，
#   会在每个 runner 上重复构建全部 6 个目标（还包含大量跨平台无意义工作）。
#
# 平台矩阵：linux-x64 / win-x64 / darwin-x64（+desktop）/ darwin-arm64。
# darwin 目标必须在 macOS runner 上构建（SEA 注入后需 codesign 临时签名）。
# 2026-10-27 实测：macos-latest 排队 15 分钟未分配 runner 直接 cancelled
# （win/linux 正常），偶发时段性；若持续复现需错峰重跑或审视账号 macOS 并发额度。
# ============================================================================

name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "cgq0/**"
      - "**/*.md"
      - "AGENTS.md"
  workflow_dispatch:
    # 固定 Release 语义下每次 push 都刷新资产，无需 force 开关；dispatch 仅作手动重跑。

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win-x64 }
          # 桌面只打 x86 mac（2026-10-24 裁决）；arm64 runner 上交叉构建 x64
          - { os: macos-latest, target: darwin-x64, desktop: true }
          - { os: macos-latest, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # 必须全量历史 + tag：`+cq.<n>.g<sha>` fork 标识构建时由 scripts/fork-build-meta.mjs
      # 从 git 推导（基线 = 最近官方同步合并提交，rev-list 需要全量历史），默认浅克隆
      # 无历史会让产物退化成 cq.dev.g<sha>，丢失提交距离。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve fork build metadata
        # zip 资产名与 Release 标题要和二进制 --version 里的身份一致，这里跑共享脚本
        # scripts/fork-build-meta.mjs 独立解析同一份 git 信息（cli build.mjs 与 desktop
        # build-metadata.mjs 同引一个实现，语义由 build.test.mjs 锚定）。脚本对 git 失败
        # 优雅降级，但 CI 有全量历史且树干净，这里严格校验输出形态：落到 cq.dev 形态
        # 说明全量历史/锚点假设已破，资产名与二进制不一致比构建失败更糟。
        shell: bash
        run: |
          META=$(node scripts/fork-build-meta.mjs)
          case "$META" in
            cq.[0-9]*.g[0-9a-f]*) ;;
            *) echo "unexpected fork build metadata: $META" >&2; exit 1 ;;
          esac
          echo "FORK_META=$META" >> "$GITHUB_ENV"

      # pnpm 版本取自根 package.json 的 packageManager 字段（10.33.2）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0" # 与 mise.toml 基线一致
          cache: pnpm

      - name: Install dependencies
        env:
          # Electron 二进制只有 desktop leg 需要（经 electron-builder 按 electronVersion
          # 41.2.0 自行下载）；cli/server leg 完全用不到，跳过下载省时间带宽。
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ matrix.desktop == true && '0' || '1' }}
        run: pnpm install --frozen-lockfile

      - name: Rebuild unsafe-pointer with node-gyp (win SEA TUI fix)
        # opentui TUI 的 FFI 闭包依赖 unsafe-pointer 0.2.0（npm prebuild 为 zig 编译）。
        # zig 产物静态按模块名导入 NODE.EXE：SEA 进程主模块名是 zcode-cli.exe，
        # 加载器解析导入时会把 PATH 上的 node.exe 当依赖 DLL 二次加载，addon 跨
        # node 实例调 napi_* → TUI 启动即 0xC0000005（2026-10-27 win-x64 release
        # 实测复现，完整根因链见 cgq0/docs/diary/2026-10-27.win.md；--version/-p/
        # app-server 不碰 TUI 闭包故正常，build-sea 冒烟只测 --version 所以一直绿）。
        # node-gyp/MSVC 构建走 delay-load（首次调用经 GetModuleHandle 解析进程主
        # 模块，与主模块名无关；koffi/pty 同链路在 SEA 下实测正常）。包内自带
        # binding.gyp 与 src/binding.c，就地重编译覆盖 win32-x64 prebuild，后续
        # sea-tui-assets 收集与运行时 node-gyp-build 查找都命中 prebuilds 路径。
        # 仅 win-x64：darwin/linux 的 zig prebuild 走平台动态符号解析，无此问题。
        # node-gyp 必须 >=12.1（VS 2026/18.x 识别，13.0.1 修版本解析）：runner 已升级
        # VS 18 Enterprise，11.x 报 unknown version 直接 find VS 失败（2026-10-27
        # run 40532699443 实测；pnpm install 里 cpu-features 的 node-gyp@11 同样失败，
        # 只是 optional 不阻塞）。包根解析用 require.resolve('unsafe-pointer')：
        # 该包 exports 未暴露 ./package.json 子路径（首跑 ERR_PACKAGE_PATH_NOT_EXPORTED）。
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          pkg="$(node -p "require('path').dirname(require.resolve('unsafe-pointer'))")"
          echo "unsafe-pointer package dir: $pkg"
          # binding.gyp 的 target_name 是 node_unsafe_pointer（产物
          # build/Release/node_unsafe_pointer.node），与 prebuilds 里的发布名不同，
          # 拷贝时两边各用其名（run 40535391823 实测 cp 按 unsafe-pointer.node 找不到）。
          (cd "$pkg" && npx -y node-gyp@13 rebuild)
          cp "$pkg/build/Release/node_unsafe_pointer.node" "$pkg/prebuilds/win32-x64/unsafe-pointer.node"
          echo "win32-x64 prebuild replaced with node-gyp (MSVC) build"

      - name: Build CLI bundle and workspace deps
        # 等价于上游 build:sea 的 turbo 前半段，但用 pnpm 拓扑构建且只构建本矩阵需要的部分
        run: pnpm --filter "@zcode/cli..." build

      - name: Compile @zcode/shared dist
        # shared 是源码形态包（无 build 脚本，exports 直指 src），但 SEA 运行时闭包
        # 断言 packages/shared/dist/index.js 必须存在；上游构建机靠 typecheck 副产物，
        # 干净 CI 需要显式编译（2026-10-20 windows runner 实测报错）。
        run: pnpm exec tsc -p packages/shared/tsconfig.json

      - name: Build official plugin MCP runtimes
        # SEA 资产收集与 server stage 的 requiresRuntime 插件都断言 dist/mcp/server.js
        # （browser-use 复用 node-repl-host 的 server）。插件 dist 被 gitignore，干净 CI
        # 必须显式构建。清单对齐上游 build-desktop-agent-cli.mjs 的
        # requiredDevPluginRuntimeBuilds，上游新增 requiresRuntime 插件时需同步此处。
        shell: bash
        run: |
          for pkg in \
            @zcode/android-emulator-plugin \
            @zcode/ios-simulator-plugin \
            @zcode/node-repl-host \
            @zcode/browser-use-plugin \
            @zcode/documents-plugin \
            @zcode/pdf-plugin \
            @zcode/presentations-plugin \
            @zcode/spreadsheets-plugin \
          ; do
            pnpm --filter "$pkg" build
          done

      - name: Build SEA binary (${{ matrix.target }})
        # build-sea 脚本自带 host 目标冒烟测试（--version），跨平台目标跳过
        run: pnpm --filter @zcode/cli sea --target ${{ matrix.target }}

      - name: Smoke test SEA TUI (native chain crash guard)
        # build-sea 自带冒烟只跑 --version，测不到 TUI 路径：TUI 的原生闭包
        # （opentui.dll + koffi + unsafe-pointer）只在 zcode-tui-runtime 资产解包后才
        # 加载。非 TTY 下 tui 必须优雅退出（exit 1 + "interactive terminal" 提示）；
        # 崩溃退出码（win bash 下 139；原生 0xC0000005/0xC0000409 的无符号值
        # 3221225477/3221226505；unix 信号段 133-139；timeout 124）都说明原生链路
        # 在 SEA 下 broken——2026-10-27 实测：zig 版 unsafe-pointer 在 win SEA 下
        # TUI 即崩但 CI 因只测 --version 一直绿，此步就是那条回归的护栏。
        # macOS 无 GNU timeout（brew coreutils 提供 gtimeout），动态探测。
        shell: bash
        run: |
          # 产物名映射与 Package 步骤一致（win-x64 → zcode-windows-x64.exe，其余
          # target 与产物同名；按 ${{ matrix.target }} 直接拼接会拼出
          # zcode-win-x64.exe 找不到文件——run 40536478016 实测 exit 127）。
          case "${{ matrix.target }}" in
            win-x64)      exe="apps/zcode-cli/packages/cli/dist/zcode-windows-x64.exe" ;;
            linux-x64)    exe="apps/zcode-cli/packages/cli/dist/zcode-linux-x64" ;;
            darwin-x64)   exe="apps/zcode-cli/packages/cli/dist/zcode-darwin-x64" ;;
            darwin-arm64) exe="apps/zcode-cli/packages/cli/dist/zcode-darwin-arm64" ;;
            *) echo "unknown target" >&2; exit 1 ;;
          esac
          # 统一用 node 包装跑并捕获退出码/输出：GNU timeout 三平台不可靠——macOS
          # 无 timeout/gtimeout，且 bash -e 下 to=$(command -v ... || ...) 链尾失败
          # 的非零退出码会静默杀掉整个脚本（run 40540577375 darwin 两 leg 在
          # ##[endgroup] 后零输出即 exit 1，即死于此，SEA 实际根本没跑）。
          out="$(node --input-type=commonjs -e '
            const { spawn } = require("node:child_process");
            const [exe, sec] = process.argv.slice(1);
            const child = spawn(exe, ["tui"], { stdio: ["ignore", "pipe", "pipe"] });
            let out = "";
            child.stdout.on("data", (d) => (out += d));
            child.stderr.on("data", (d) => (out += d));
            const timer = setTimeout(() => {
              console.log("SMOKE_TIMEOUT");
              child.kill("SIGKILL");
            }, Number(sec) * 1000);
            child.on("error", (e) => {
              clearTimeout(timer);
              console.log("SMOKE_SPAWN_ERROR:" + e.message);
            });
            child.on("close", (code) => {
              clearTimeout(timer);
              console.log("SMOKE_EXIT:" + (code === null ? "killed" : code));
              if (out) console.log(out);
            });
          ' "$exe" 90)"
          echo "$out" | head -8
          code="$(printf '%s\n' "$out" | sed -n 's/^SMOKE_EXIT://p' | head -1)"
          if [ "$code" != "1" ]; then
            echo "::error::SEA tui exited '$code' (expected 1 with interactive-terminal message)"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q "interactive terminal" || {
            echo "::error::SEA tui exited 1 but without interactive-terminal message"
            exit 1
          }
          echo "SEA tui smoke OK"

      - name: Stage zcode-webapp
        # fork 自托管 Web 产物（2026-10-25 选 B 裁决，替换原 zcode-server staged 目录）：
        # entry-http 自包含 bundle + web 静态 + agent zcode.cjs + node-pty 原生模块 +
        # 随包 Node（复用 server-cli 的缓存/镜像链）。zip 内与 zcode-serve(.ps1) 同级。
        # win-x64 → win32-x64 映射沿用原 SERVER_TARGET 约定。
        # 必须 shell: bash：多行命令用 bash 的 \ 续行，windows runner 默认 PowerShell
        # 不认续行符，--target 会被当新语句报 ParserError（解析期失败，整步不执行，
        # 2026-10-27 实测踩坑；af93ce63 引入该步骤后首次上 CI 才暴露）。
        shell: bash
        run: |
          pnpm --filter @zcode/server build
          pnpm --filter @zcode/web build
          node cgq0/scripts/stage-webapp.mjs \
            --target ${{ matrix.target == 'win-x64' && 'win32-x64' || matrix.target }} \
            --out webapp-pkg/zcode-webapp

      - name: Build desktop app (darwin-x64)
        if: matrix.desktop == true
        # 上游正式打包入口：prepare:runtime-assets → production build（含
        # prepare:build-meta，fork 身份在这里写进 build-meta.json）→ electron-builder
        # （dmg+zip target 照上游跑，我们只取 dist/mac/ZCode.fork.app 拼最终 zip）→ 运行时
        # 闭包校验 → 体积审计。ZCODE_ENV=production：不设则默认 preview 身份
        # （desktop-product-identity.mjs），打出来会是 "ZCode Preview"。
        # ZCODE_DESKTOP_PRODUCT_NAME：fork 专属产品名，只改 .app/菜单栏/About 显示，
        # appId/userData 仍与官方 ZCode 相同（共享登录态与任务数据，同时只能运行一个）。
        # CSC_IDENTITY_AUTO_DISCOVERY=false：CI 无签名证书，走 ad-hoc 签名，与本地打包一致。
        env:
          ZCODE_ENV: production
          ZCODE_DESKTOP_PRODUCT_NAME: "ZCode.fork"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node packages/desktop/scripts/bundle.mjs --os mac --arch x64

      - name: Package platform bundle into versioned zip
        # 后缀只进 zip 文件名，包内产物名恒定（zcode-cli / zcode-webapp/ / .app
        # 随构建身份命名，当前为 ZCode.fork.app）：
        # 解压即用不随构建漂移，身份由 zip 名 + 二进制 --version / 桌面 About 双重承载。
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$TARGET" in
            win-x64)      cli_src="zcode-windows-x64.exe"; inner="zcode-cli.exe" ;;
            linux-x64)    cli_src="zcode-linux-x64";       inner="zcode-cli" ;;
            darwin-x64)   cli_src="zcode-darwin-x64";      inner="zcode-cli" ;;
            darwin-arm64) cli_src="zcode-darwin-arm64";    inner="zcode-cli" ;;
            *) echo "unknown target: $TARGET" >&2; exit 1 ;;
          esac
          zipname="zcode-v${version}-${FORK_META}-${TARGET}.zip"
          rm -rf release-pkg && mkdir -p release-pkg
          cp "apps/zcode-cli/packages/cli/dist/$cli_src" "release-pkg/$inner"
          # cp 会丢执行位（umask 归一），unix 内核要它才能直接跑
          [ "$RUNNER_OS" = "Windows" ] || chmod 755 "release-pkg/$inner"
          # 自托管 Web 产物与两个启动器（sh/ps1 全平台都带，互不干扰）
          cp -R "webapp-pkg/zcode-webapp" "release-pkg/zcode-webapp"
          cp cgq0/webapp/zcode-serve "release-pkg/zcode-serve"
          cp cgq0/webapp/zcode-serve.ps1 "release-pkg/zcode-serve.ps1"
          [ "$RUNNER_OS" = "Windows" ] || chmod 755 "release-pkg/zcode-serve"
          if [ "${{ matrix.desktop }}" = "true" ]; then
            app_path="$(ls -d packages/desktop/dist/mac/*.app 2>/dev/null | head -1 || true)"
            [ -n "$app_path" ] || { echo "desktop .app not found in packages/desktop/dist/mac" >&2; exit 1; }
            cp -R "$app_path" "release-pkg/$(basename "$app_path")"
          fi
          # windows runner 的 git-bash 无 zip 命令，回退 7z（三平台镜像均预装）；
          # .app 判断必须用 if——`[ -d ] && ...` 在无 .app 的 leg 会因 set -e 中断步骤；
          # .app 名必须动态 glob：productName 随构建身份变（ZCode/ZCode Preview/ZCode.fork），
          # 硬编码名字会在改名后静默把 desktop 漏出 zip（2026-10-25 实测踩坑）；
          # zip 的 -y 必须加：.app 框架内有符号链接，默认解引用会复制出双份内容并破坏 app 结构
          (cd release-pkg && app_bundle="$(ls -d -- *.app 2>/dev/null | head -1 || true)" && if command -v zip > /dev/null 2>&1; then
            entries=("$inner" "zcode-webapp" "zcode-serve" "zcode-serve.ps1")
            if [ -n "$app_bundle" ]; then entries+=("$app_bundle"); fi
            zip -qry "../$zipname" "${entries[@]}"
          else
            args=(a -tzip -bso0 "../$zipname" "$inner" "zcode-webapp" "zcode-serve" "zcode-serve.ps1")
            if [ -n "$app_bundle" ]; then args+=("$app_bundle"); fi
            7z "${args[@]}"
          fi)
          mkdir -p release-out && mv "$zipname" release-out/
          ls -1 release-out/

      - name: Generate checksums
        shell: bash
        env:
          SEA_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=commonjs - <<'EOF'
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const dir = "release-out";
          const target = process.env.SEA_TARGET;
          const lines = fs
            .readdirSync(dir)
            .filter((f) => /^zcode-v.*\.zip$/.test(f))
            .sort()
            .map(
              (f) =>
                `${createHash("sha256").update(fs.readFileSync(`${dir}/${f}`)).digest("hex")}  ${f}`,
            );
          fs.writeFileSync(`${dir}/SHA256SUMS-${target}.txt`, `${lines.join("\n")}\n`);
          console.log(lines.join("\n"));
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fork-${{ matrix.target }}
          path: |
            release-out/*.zip
            release-out/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 全量历史：与 build job 独立解析同一份 fork 元数据（同一 SHA，结果必然一致），
      # 保证 Release 标题、zip 资产名、二进制 --version 三处身份完全对应。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version and fork metadata
        # 与 build job 同跑 scripts/fork-build-meta.mjs（同 SHA 全量历史，结果必然
        # 一致）；输出形态严格校验，异常直接失败，避免资产名与二进制身份不一致。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          META=$(node scripts/fork-build-meta.mjs)
          case "$META" in
            cq.[0-9]*.g[0-9a-f]*) ;;
            *) echo "unexpected fork build metadata: $META" >&2; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "META=$META" >> "$GITHUB_ENV"

      - name: Move release tag to build commit
        # Release 页面的 source.zip/tar.gz 是 GitHub 按 tag 指向自动生成的归档。
        # tag 只在首次 gh release create 时打在当时的 HEAD，此后每次 push 仅
        # edit+替换资产、tag 不动——归档停留在旧 commit（实测 v3.16.2 停在
        # 2026-10-24，与 zip 资产对应的源码差数日）。tag 不参与版本身份
        # （cq.<n>.g<sha> 基线来自 fork-build-meta），每次构建把 tag 刷到当前
        # SHA，保持 source 归档与资产同源（GitHub 惰性重生成，有 CDN 缓存延迟）。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION"
          current="$(git rev-parse "refs/tags/$TAG" 2>/dev/null || true)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "tag $TAG already at $GITHUB_SHA"
            exit 0
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          echo "moved tag $TAG: ${current:-<none>} -> $GITHUB_SHA"

      - name: Create or refresh GitHub Release
        # 固定单条 Release：标题/说明随每次构建刷新，资产先删后传整体替换，
        # 页面上只有最新一份且文件名与本次构建一一对应（2026-10-21 裁决）。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION"
          TITLE="ZCode fork v$VERSION · $META"
          cat > release-notes-body.md <<'NOTES'
          fork 三产物统一构建（同一 commit 出包，cli/server/desktop 版本一致）。每个 zip
          对应一个平台，包内文件名不带版本；本 Release 的资产每次 push 整体替换为最新构建，
          历史构建见该 run 的 Actions artifacts（保留 14 天）。

          | 文件 | 平台 | 包内内容 |
          |---|---|---|
          | zcode-v*-darwin-x64.zip | macOS（Intel） | zcode-cli + zcode-serve + zcode-webapp + ZCode.fork.app |
          | zcode-v*-darwin-arm64.zip | macOS（Apple Silicon） | zcode-cli + zcode-serve + zcode-webapp |
          | zcode-v*-linux-x64.zip | Linux x64 | zcode-cli + zcode-serve + zcode-webapp |
          | zcode-v*-windows-x64.zip | Windows x64 | zcode-cli.exe + zcode-serve(.ps1) + zcode-webapp |

          **zcode-cli**（Node SEA 单文件）：解压得固定名 `zcode-cli`（Windows 为
          `zcode-cli.exe`），改名 `zcode` 放入 PATH（如 `~/.local/bin`），`chmod +x` 即用。

          **zcode-serve + zcode-webapp**（自托管 Web 版，全平台）：解压后把目录加进
          PATH，`zcode-serve start`（Windows：`.\zcode-serve.ps1 start`）即起完整
          Web 端（默认 127.0.0.1:3030，自带 Node 与 agent 运行时，无需系统依赖）。
          远程访问推荐 SSH 隧道：`ssh -N -L 3030:127.0.0.1:3030 user@host`，本地
          浏览器开 http://localhost:3030。`zcode-serve stop|status` 管理生命周期，
          start/stop 幂等、后台脱离（SSH 断开不亡）。数据写用户 ~/.zcode，与
          desktop/CLI 共享账号凭据，任务按宿主身份分区。暴露到局域网时加
          `--token`。

          **ZCode.fork.app**（仅 darwin-x64）：拖入 `/Applications`，蓝底图标与
          "ZCode.fork" 名字和官方 ZCode.app 一眼区分，可同时安装互不覆盖。appId 与
          userData 仍与官方版相同：登录态、任务、配置全部共享，同时只能运行一个，
          切换前先退出另一个。

          版本身份：三产物统一显示 `3.16.2+cq.<n>.g<sha>`（zcode-cli/zcode-server 的
          `--version`，桌面「关于」窗口版本号旁的 `· cq...`），与 zip 文件名、Release
          标题一致，用于确认拿到的是哪次构建。

          macOS 首次运行被 Gatekeeper 拦截时清除隔离标记（-r 递归，对 .app 目录必须加）：
          `xattr -rd com.apple.quarantine ./zcode-cli`；ZCode.fork.app 同法指向 .app 路径。
          Windows SmartScreen 警告：二进制未做 Authenticode 签名，选「更多信息 → 仍要运行」。
          校验和见各 SHA256SUMS-<target>.txt（对象为对应 zip）。
          NOTES
          # 非官方构建声明置顶：明确产物来源与构建 commit（商标合规：nominative use）
          {
            printf '%s\n\n' "> ℹ️ 非官方构建：本产物由 fork [${GITHUB_REPOSITORY}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}) 的 CI 基于 [zai-org/ZCode](https://github.com/zai-org/ZCode)（Apache-2.0）源码自动编译，与智谱官方无关。构建来源 commit：\`${GITHUB_SHA}\`"
            cat release-notes-body.md
          } > release-notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            # 先删全部旧资产再上传：文件名带构建身份，不清会跨构建累积
            while IFS= read -r name; do
              [ -n "$name" ] && gh release delete-asset "$TAG" "$name" --yes
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" artifacts/zcode-v*-*.zip artifacts/SHA256SUMS-*.txt --clobber
          else
            gh release create "$TAG" \
              artifacts/zcode-v*-*.zip \
              artifacts/SHA256SUMS-*.txt \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
